# Event colour -> category, for events in the personal calendar.
#
# One "colour = category" per line. The colour is matched case-insensitively
# against the COLOR property Proton puts on each event in the share-link file
# (a CSS colour name or a hex code, whichever Proton emits; run
# `assistant-calendar-check` to see the exact strings your calendar uses).
# Comment lines start with "# " (hash, space); a hex colour is written
# directly after the hash, e.g. "#3366cc = uni".
# Colours with no entry here show up to the assistant as "[colour <value>]" so
# nothing is silently mislabelled.
#
# The assistant knows these four categories (see system-prompt.md):
#   sports    exercise; an evening session does not stop you cooking
#   uni       lectures, study, deadlines
#   meeting   meetings with other people
#   dinner    dinner plans with others; away from home unless the title says
#             otherwise
#
# Fill in your own colours, for example:
#   green  = sports
#   blue   = uni
#   purple = meeting
#   orange = dinner
